# golangci-lint configuration for Microsoft Agent Framework Go SDK
# https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  go: "1.22"

linters:
  enable:
    # Default linters (in v2: gosimple is part of staticcheck)
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    # Additional recommended linters
    - bodyclose
    - copyloopvar
    - dogsled
    - dupl
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - misspell
    - nakedret
    - noctx
    - nolintlint
    - prealloc
    - revive
    - unconvert
    - unparam
    - whitespace

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true

    govet:
      enable-all: true

    gocyclo:
      min-complexity: 15

    goconst:
      min-len: 3
      min-occurrences: 3

    misspell:
      locale: US

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code

    staticcheck:
      checks:
        - "all"
        - "-ST1000" # Package comments - handled by revive

    gosec:
      excludes:
        - G104 # Audit errors not checked - too noisy for now

  exclusions:
    generated: lax
    rules:
      # Exclude some linters from running on test files
      - path: _test\.go
        linters:
          - dupl
          - gosec
          - goconst
          - errcheck
          - gocyclo
          - unparam
          - govet

      # Exclude testutil from certain linters
      - path: testutil/
        linters:
          - gosec

      # Exclude shadow checking for err
      - text: 'shadow: declaration of "err"'
        linters:
          - govet

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
